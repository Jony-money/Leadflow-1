function getReadingWeek() {
  const epoch = new Date(2026, 0, 5);
  const now = new Date();
  const days = Math.floor((now - epoch) / (24*60*60*1000));
  return ((days >= 0 ? days : 0) / 7 | 0) % 4;
}
function getCurrentDay() { return DAYS[new Date().getDay()]; }
function getTodaysReading() {
  const day = getCurrentDay();
  const plan = READING_PLAN[day];
  const week = getReadingWeek();
  return { ...plan, today: plan.readings[week], weekInCycle: week };
}

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const minutesFromTimeStr = (t) => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const formatTime = (t) => {
  const [h,m] = t.split(":").map(Number);
  const realH = h % 24;
  const ampm = realH >= 12 ? "PM" : "AM";
  const displayH = realH === 0 ? 12 : realH > 12 ? realH-12 : realH;
  return `${displayH}:${String(m).padStart(2,"0")} ${ampm}`;
};
function getCurrentBlock(day) {
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  const dayData = SCHEDULE[day];
  if (!dayData) return null;
  for (let i = 0; i < dayData.blocks.length; i++) {
    const b = dayData.blocks[i];
    const start = minutesFromTimeStr(b.start);
    const endRaw = minutesFromTimeStr(b.end);
    if (endRaw > 24*60) {
      if (nowMins >= start || nowMins < (endRaw - 24*60)) {
        const total = endRaw - start;
        const elapsed = nowMins >= start ? nowMins - start : (24*60 - start) + nowMins;
        return { ...b, index: i, progress: elapsed/total };
      }
    } else if (nowMins >= start && nowMins < endRaw) {
      return { ...b, index: i, progress: (nowMins - start) / (endRaw - start) };
    }
  }
  return null;
}
function getNextBlock(day, currentIndex) {
  const dayData = SCHEDULE[day]; if (!dayData) return null;
  if (currentIndex !== null && currentIndex !== undefined) {
    if (currentIndex + 1 < dayData.blocks.length) return dayData.blocks[currentIndex+1];
    return null;
  }
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  for (const b of dayData.blocks) if (minutesFromTimeStr(b.start) > nowMins) return b;
  return null;
}
function minutesUntilEnd(block) {
  if (!block) return 0;
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  const endRaw = minutesFromTimeStr(block.end);
  if (endRaw > 24*60) {
    const realEnd = endRaw - 24*60;
    if (nowMins >= minutesFromTimeStr(block.start)) return (24*60 - nowMins) + realEnd;
    return realEnd - nowMins;
  }
  return endRaw - nowMins;
}

const safeDelete = (key) => { try { localStorage.removeItem(key); } catch {} };

function CalisthenicsView({ dayName }) {
  const calDays = ["monday","tuesday","wednesday","thursday"];
  const initialDay = calDays.includes(dayName) ? dayName : "monday";
  const [selected, setSelected] = useState(initialDay);
  const cal = CALISTHENICS[selected];
  const isToday = dayName === selected;
  const [completed, setCompleted] = useState(false);
  const [roundsDone, setRoundsDone] = useState(0);
  useEffect(() => {
    const data = safeGet(`cal-log:${selected}:${todayKey()}`);
    if (data) { setCompleted(data.completed || false); setRoundsDone(data.rounds || 0); }
    else { setCompleted(false); setRoundsDone(0); }
  }, [selected]);
  const logRound = () => {
    const newRounds = Math.min(roundsDone + 1, cal.rounds);
    setRoundsDone(newRounds);
    safeSet(`cal-log:${selected}:${todayKey()}`, { rounds: newRounds, completed: newRounds >= cal.rounds });
    if (newRounds >= cal.rounds) setCompleted(true);
  };
  const reset = () => { setCompleted(false); setRoundsDone(0); safeDelete(`cal-log:${selected}:${todayKey()}`); };
  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
        {calDays.map(d => {
          const isSel = selected === d;
          const isTd = dayName === d;
          return (
            <button key={d} onClick={() => setSelected(d)}
              style={{ flex: 1, padding: 10, borderRadius: 12,
                background: isSel ? C.accent : "transparent",
                border: `1px solid ${isSel ? C.accent : isTd ? C.accentBorder : C.border}`,
                cursor: "pointer", textAlign: "center" }}>
              <div className="display" style={{ fontSize: 10, letterSpacing: "0.18em", color: isSel ? "#000" : C.textFaint }}>
                {d.slice(0,3).toUpperCase()}
              </div>
              <div className="display" style={{ fontSize: 14, marginTop: 2, lineHeight: 1, color: isSel ? "#000" : C.text }}>
                {CALISTHENICS[d].title}
              </div>
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4 }}>
        <h2 className="display" style={{ fontSize: 36, color: C.text, margin: 0 }}>{cal.title}</h2>
        <span className="mono" style={{ fontSize: 12, color: C.textFaint }}>{cal.duration}</span>
      </div>
      <p style={{ fontSize: 14, color: C.textMuted, margin: "0 0 16px" }}>{cal.subtitle}</p>
      <div style={{ padding: 16, borderRadius: 16, marginBottom: 16,
        background: completed ? C.greenDim : "rgba(20,20,20,0.5)",
        border: `1px solid ${completed ? C.greenBorder : C.border}` }}>
        <div style={{ fontSize: 10, color: completed ? C.green : C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>
          {isToday ? "Today's Progress" : `Progress (${selected})`}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <div style={{ display: "flex", gap: 8 }}>
            {Array.from({ length: cal.rounds }).map((_, i) => (
              <div key={i} style={{ width: 36, height: 36, borderRadius: "50%",
                border: `2px solid ${i < roundsDone ? C.green : i === roundsDone ? C.accent : C.borderStrong}`,
                background: i < roundsDone ? "rgba(34,197,94,0.2)" : "transparent",
                display: "flex", alignItems: "center", justifyContent: "center" }}>
                {i < roundsDone ? <Icon name="check" size={16} color={C.green} strokeWidth={3} /> :
                  <span className="display" style={{ fontSize: 14, color: C.textFaint }}>{i+1}</span>}
              </div>
            ))}
          </div>
          {completed ? (
            <button onClick={reset} style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.textFaint, padding: "8px 12px", borderRadius: 10, cursor: "pointer", fontSize: 12 }}>
              Reset
            </button>
          ) : (
            <button onClick={logRound} className="display"
              style={{ background: C.accent, color: "#000", border: "none", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, letterSpacing: "0.1em" }}>
              + ROUND {roundsDone+1}
            </button>
          )}
        </div>
      </div>
      <div style={{ padding: 14, borderRadius: 12, marginBottom: 16, background: "rgba(20,20,20,0.3)", border: `1px solid ${C.border}` }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 4 }}>Warm-up</div>
        <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.4 }}>{cal.warmup}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 4 }}>
          {cal.rounds} Rounds Of:
        </div>
        {cal.exercises.map((ex, i) => (
          <div key={i} style={{ padding: 14, borderRadius: 14, background: "rgba(20,20,20,0.4)", border: `1px solid ${C.border}`,

        <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.5 }}>{cal.notes}</div>
      </div>
    </div>
  );
}

        <div className="serif" style={{ fontSize: 17, color: C.text, lineHeight: 1.7, fontStyle: "italic" }}>
          "{reading.today.text}"
        </div>
      </div>
      <div style={{ padding: 18, borderRadius: 16, background: `${reading.color}10`, border: `1px solid ${reading.color}30`, marginBottom: 16 }}>
        <div style={{ fontSize: 10, color: reading.color, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 6 }}>Apply It Today</div>
        <div style={{ fontSize: 14, color: C.text, lineHeight: 1.5 }}>{reading.today.apply}</div>
      </div>
      {isReadToday ? (
        <div style={{ padding: 18, borderRadius: 16, textAlign: "center", background: C.greenDim, border: `1px solid ${C.greenBorder}` }}>
          <Icon name="check" size={24} color={C.green} strokeWidth={3} style={{ display: "block", margin: "0 auto 6px" }} />
          <div className="display" style={{ fontSize: 18, color: C.text }}>READ FOR TODAY</div>
          <button onClick={unmark} style={{ marginTop: 8, background: "transparent", border: "none", color: C.textFaint, cursor: "pointer", fontSize: 12 }}>Unmark</button>
        </div>
      ) : (
        <button onClick={markRead} className="display"
          style={{ width: "100%", padding: 18, borderRadius: 16, background: reading.color, color: "#000", border: "none",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8, cursor: "pointer", fontSize: 16, letterSpacing: "0.1em" }}>
          <Icon name="check" size={18} color="#000" strokeWidth={3} />
          MARK AS READ
        </button>
      )}
      <div style={{ marginTop: 32 }}>
        <h3 className="display" style={{ fontSize: 22, color: C.text, margin: "0 0 12px", letterSpacing: "0.1em" }}>4-WEEK CYCLE</h3>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>Same theme each weekday, different passage each week. After 4 weeks, the cycle repeats.</div>
        {DAYS.map((d, i) => {
          const p = READING_PLAN[d];
          return (
            <div key={d} style={{ padding: 12, borderRadius: 10, display: "flex", alignItems: "center", gap: 12,
              borderBottom: i < 6 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ width: 4, height: 32, borderRadius: 2, background: p.color, flexShrink: 0 }} />
              <div style={{ flex: 1 }}>
                <div className="display" style={{ fontSize: 14, color: C.text, lineHeight: 1 }}>{DAY_LABELS[i]} · {p.theme}</div>
                <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>{p.subtitle}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function getSuggestion(last, ex) {
  if (!last) return { weight: 0, reps: ex.repsHigh };
  if (last.topReps >= ex.repsHigh) return { weight: last.topWeight + (ex.increment || 0), reps: ex.repsLow };
  return { weight: last.topWeight, reps: Math.min(ex.repsHigh, last.topReps + 1) };
}

function ActiveWorkout({ day, onExit }) {
  const workout = GYM_WORKOUTS[day];
  const [exerciseIdx, setExerciseIdx] = useState(0);
  const [setLogs, setSetLogs] = useState({});
  const [currentWeight, setCurrentWeight] = useState("");
  const [currentReps, setCurrentReps] = useState("");
  const [history, setHistory] = useState({});
  const [showRestTimer, setShowRestTimer] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const ex = workout.exercises[exerciseIdx];
  const completedSets = setLogs[ex.id]?.length || 0;
  const totalSets = ex.sets;
  useEffect(() => {
    const data = safeGet(`workout-prs:${day}`);
    if (data) setHistory(data);
    const draft = safeGet(`workout-draft:${day}:${todayKey()}`);
    if (draft) { setSetLogs(draft.setLogs || {}); setExerciseIdx(draft.exerciseIdx || 0); }
    setLoaded(true);
  }, [day]);
  useEffect(() => {
    if (!loaded) return;
    const last = history[ex.id];
    const existing = setLogs[ex.id] || [];
    if (existing.length > 0) {
      const lastSet = existing[existing.length - 1];
      setCurrentWeight(String(lastSet.weight)); setCurrentReps(String(lastSet.reps));
    } else if (last) {
      const s = getSuggestion(last, ex);
      setCurrentWeight(String(s.weight)); setCurrentReps(String(s.reps));
    } else { setCurrentWeight(""); setCurrentReps(String(ex.repsHigh)); }
  }, [exerciseIdx, loaded]);
  const saveDraft = (newLogs, newIdx) => safeSet(`workout-draft:${day}:${todayKey()}`, { setLogs: newLogs, exerciseIdx: newIdx ?? exerciseIdx });
  const logSet = () => {
    const w = parseFloat(currentWeight) || 0;
    const r = parseInt(currentReps) || 0;
    if (r === 0) return;
    const exSets = setLogs[ex.id] || [];
    const newSets = [...exSets, { weight: w, reps: r }];
    const newLogs = { ...setLogs, [ex.id]: newSets };
    setSetLogs(newLogs); saveDraft(newLogs); setShowRestTimer(true);
  };
  const undoLast = () => {
    const exSets = setLogs[ex.id] || [];
    if (exSets.length === 0) return;
    const newLogs = { ...setLogs, [ex.id]: exSets.slice(0, -1) };
    setSetLogs(newLogs); saveDraft(newLogs);
  };
  const nextExercise = () => {
    if (exerciseIdx < workout.exercises.length - 1) {
      const newIdx = exerciseIdx + 1;
      setExerciseIdx(newIdx); saveDraft(setLogs, newIdx); setShowRestTimer(false);
    } else { finishWorkout(); }
  };
  const prevExercise = () => {
    if (exerciseIdx > 0) { const newIdx = exerciseIdx - 1; setExerciseIdx(newIdx); saveDraft(setLogs, newIdx); }
  };
  const finishWorkout = () => {
    safeSet(`workout-log:${day}:${todayKey()}`, { setLogs, completed: new Date().toISOString() });
    const newPrs = { ...history };
    workout.exercises.forEach(exer => {
      const sets = setLogs[exer.id];
      if (!sets || sets.length === 0) return;
      const topWeight = Math.max(...sets.map(s => s.weight));
      const topSet = sets.reduce((best, s) => (s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps) ? s : best), sets[0]);
      newPrs[exer.id] = { topWeight, topReps: topSet.reps, sets, date: todayKey() };
    });
    safeSet(`workout-prs:${day}`, newPrs);
    safeDelete(`workout-draft:${day}:${todayKey()}`);
    onExit();
  };
  const exHistory = history[ex.id];
  const allSetsDone = completedSets >= totalSets;
  const isLastEx = exerciseIdx === workout.exercises.length - 1;
  const inputBoxStyle = { padding: 20, borderRadius: 16, background: "rgba(20,20,20,0.6)", border: `1px solid ${C.borderStrong}` };
  const stepBtnStyle = { width: 48, height: 48, borderRadius: "50%", background: C.surfaceAlt, border: "none", display: "flex", alignItems: "center", justifyContent: "center", color: C.text, cursor: "pointer" };
  return (
    <div className="slide-up" style={{ padding: "56px 20px 128px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <button onClick={onExit} style={{ background: "none", border: "none", color: C.textFaint, fontSize: 14, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", padding: 0 }}>
          <Icon name="chevronleft" size={18} /> Exit
        </button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Exercise</div>
          <div className="mono" style={{ fontSize: 14, color: C.textMuted }}>{exerciseIdx + 1} / {workout.exercises.length}</div>
        </div>
        <button onClick={finishWorkout} className="display" style={{ background: "none", border: "none", color: C.accent, fontSize: 14, letterSpacing: "0.1em", cursor: "pointer", padding: 0 }}>
          FINISH
        </button>
      </div>
      <div style={{ textAlign: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>{workout.title} DAY</div>
      </div>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div className="display" style={{ fontSize: 44, color: C.text, lineHeight: 1 }}>{ex.name}</div>
        <div style={{ fontSize: 14, color: C.textFaint, marginTop: 6 }}>
          {totalSets} sets × {ex.repsLow === ex.repsHigh ? ex.repsLow : `${ex.repsLow}–${ex.repsHigh}`} reps
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 24 }}>
        {Array.from({ length: totalSets }).map((_, i) => {
          const set = setLogs[ex.id]?.[i];
          return (
            <div key={i} style={{ width: 48, height: 48, borderRadius: "50%",
              border: `2px solid ${set ? C.green : i === completedSets ? C.accent : C.borderStrong}`,
              background: set ? "rgba(34,197,94,0.15)" : i === completedSets ? "rgba(255,107,53,0.15)" : "transparent",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              {set ? (<>
                <span className="mono" style={{ fontSize: 9, color: C.green, lineHeight: 1 }}>{set.weight}{ex.id === "plank" ? "s" : ""}</span>
                <span className="mono" style={{ fontSize: 9, color: C.green, lineHeight: 1, marginTop: 1 }}>{set.reps}{ex.id !== "plank" ? "r" : ""}</span>
              </>) : (<span className="display" style={{ fontSize: 16, color: C.textFaint }}>{i+1}</span>)}
            </div>
          );
        })}
      </div>
      {exHistory && (
        <div style={{ padding: 14, borderRadius: 16, marginBottom: 20, background: "rgba(20,20,20,0.5)", border: `1px solid ${C.border}`,
          display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Last ({exHistory.date})</div>
            <div className="mono" style={{ fontSize: 13, color: C.textMuted, marginTop: 4 }}>Top: {exHistory.topWeight}{ex.id === "plank" ? "s" : "lb"} × {exHistory.topReps} reps</div>
          </div>
          {!setLogs[ex.id]?.length && (() => {
            const s = getSuggestion(exHistory, ex);
            return (
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em" }}>Try</div>
                <div className="mono" style={{ fontSize: 13, color: C.text, marginTop: 4 }}>{s.weight}{ex.id === "plank" ? "s" : "lb"} × {s.reps}</div>
              </div>
            );
          })()}
        </div>
      )}
      {!allSetsDone ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={inputBoxStyle}>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>
              {ex.id === "plank" ? "Seconds" : "Weight (lb)"}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button style={stepBtnStyle} onClick={() => setCurrentWeight(String(Math.max(0, parseFloat(currentWeight || 0) - (ex.increment || 5))))}>
                <Icon name="minus" size={20} />
              </button>
              <input inputMode="decimal" value={currentWeight} onChange={e => setCurrentWeight(e.target.value)} placeholder="0" className="display"
                style={{ flex: 1, background: "transparent", border: "none", outline: "none", textAlign: "center", fontSize: 44, color: C.text, minWidth: 0 }} />
              <button style={stepBtnStyle} onClick={() => setCurrentWeight(String(parseFloat(currentWeight || 0) + (ex.increment || 5)))}>
                <Icon name="plus" size={20} />
              </button>
            </div>
          </div>
          <div style={inputBoxStyle}>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>
              {ex.id === "plank" ? "Reps (target sec above)" : "Reps"}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button style={stepBtnStyle} onClick={() => setCurrentReps(String(Math.max(0, parseInt(currentReps || 0) - 1)))}>
                <Icon name="minus" size={20} />
              </button>
              <input inputMode="numeric" value={currentReps} onChange={e => setCurrentReps(e.target.value)} placeholder="0" className="display"
                style={{ flex: 1, background: "transparent", border: "none", outline: "none", textAlign: "center", fontSize: 44, color: C.text, minWidth: 0 }} />
              <button style={stepBtnStyle} onClick={() => setCurrentReps(String(parseInt(currentReps || 0) + 1))}>
                <Icon name="plus" size={20} />
              </button>
            </div>
          </div>
          <button onClick={logSet} className="display"
            style={{ width: "100%", padding: 18, borderRadius: 16, background: C.accent, color: "#000", border: "none",
              fontSize: 16, letterSpacing: "0.1em",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8, cursor: "pointer" }}>
            <Icon name="check" size={18} color="#000" strokeWidth={3} />
            LOG SET {completedSets + 1}
          </button>
          {completedSets > 0 && (
            <button onClick={undoLast} style={{ width: "100%", padding: 10, borderRadius: 16, background: "transparent", border: "none", color: C.textFaint, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <Icon name="rotateccw" size={13} /> Undo last set
            </button>
          )}
        </div>
      ) : (
        <div style={{ padding: 24, borderRadius: 16, textAlign: "center", background: C.greenDim, border: `1px solid ${C.greenBorder}` }}>
          <Icon name="trophy" size={32} color={C.green} style={{ display: "block", margin: "0 auto 8px" }} />
          <div className="display" style={{ fontSize: 24, color: C.text }}>EXERCISE COMPLETE</div>
          <div style={{ fontSize: 14, color: C.textMuted, marginTop: 4 }}>Move on or review</div>
        </div>
      )}
      {showRestTimer && !allSetsDone && <RestTimer onClose={() => setShowRestTimer(false)} />}
      <div style={{ marginTop: 24, display: "flex", gap: 8 }}>
        <button onClick={prevExercise} disabled={exerciseIdx === 0}
          style={{ flex: 1, padding: 12, borderRadius: 16, border: `1px solid ${C.border}`, background: "transparent",
            color: C.textMuted, opacity: exerciseIdx === 0 ? 0.3 : 1,
            display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
            cursor: exerciseIdx === 0 ? "default" : "pointer", fontSize: 14 }}>
          <Icon name="chevronleft" size={16} /> Previous
        </button>
        <button onClick={nextExercise}
          style={{ flex: 1, padding: 12, borderRadius: 16, border: `1px solid ${C.border}`, background: "transparent",
            color: C.text, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer", fontSize: 14 }}>
          {isLastEx ? "Finish" : "Next"} <Icon name="chevronright" size={16} />
        </button>
      </div>
    </div>
  );
}

function RestTimer({ onClose }) {
  const [seconds, setSeconds] = useState(120);
  const [running, setRunning] = useState(true);
  useEffect(() => {
    if (!running) return;
    const i = setInterval(() => setSeconds(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(i);
  }, [running]);
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return (
    <div className="slide-up" style={{ position: "fixed", bottom: 100, left: 16, right: 16,
      maxWidth: 448, margin: "0 auto", padding: 16, borderRadius: 16,
      background: C.surface, border: `1px solid ${C.accentBorder}`,
      display: "flex", alignItems: "center", gap: 12, zIndex: 40 }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em" }}>Rest</div>
        <div className="display" style={{ fontSize: 28, color: C.text, lineHeight: 1, marginTop: 2 }}>
          {mins}:{String(secs).padStart(2, "0")}
        </div>
      </div>
      <button onClick={() => setSeconds(s => s + 30)} style={{ padding: "8px 12px", borderRadius: 12, background: C.surfaceAlt, border: "none", color: C.textMuted, fontSize: 12, cursor: "pointer" }}>+30s</button>
      <button onClick={() => setRunning(!running)} style={{ width: 40, height: 40, borderRadius: "50%", background: C.accent, border: "none", color: "#000", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
        <Icon name={running ? "pause" : "play"} size={16} color="#000" />
      </button>
      <button onClick={onClose} style={{ width: 40, height: 40, borderRadius: "50%", background: C.surfaceAlt, border: "none", color: C.textFaint, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
        <Icon name="x" size={16} />
      </button>
    </div>
  );
}

function HabitsTab() {
  const [checks, setChecks] = useState({});
  const [streak, setStreak] = useState(0);
  const [sleepData, setSleepData] = useState({ down: "", up: "" });
  useEffect(() => {
    const todayChecks = safeGet(`habits:${todayKey()}`);
    if (todayChecks) setChecks(todayChecks);
    const sleep = safeGet(`sleep:${todayKey()}`);
    if (sleep) setSleepData(sleep);
    let s = 0;
    for (let i = 0; i < 60; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const c = safeGet(`habits:${k}`);
      const dayIdx = d.getDay();
      const required = HARD_RULES.filter(r => !r.sundayOnly || dayIdx === 0);
      if (!c) break;
      const allDone = required.every(r => c[r.id]);
      if (!allDone) break;
      s++;
    }
    setStreak(s);
  }, []);
  const toggle = (id) => {
    const newChecks = { ...checks, [id]: !checks[id] };
    setChecks(newChecks); safeSet(`habits:${todayKey()}`, newChecks);
  };
  const saveSleep = (val) => { setSleepData(val); safeSet(`sleep:${todayKey()}`, val); };
  const calcSleepHours = () => {
    if (!sleepData.down || !sleepData.up) return null;
    const [dh, dm] = sleepData.down.split(":").map(Number);
    const [uh, um] = sleepData.up.split(":").map(Number);
    let mins = (uh*60 + um) - (dh*60 + dm);
    if (mins < 0) mins += 24*60;
    return { h: Math.floor(mins/60), m: mins%60, total: mins };
  };
  const sleep = calcSleepHours();
  const dayIdx = new Date().getDay();
  const visibleRules = HARD_RULES.filter(r => !r.sundayOnly || dayIdx === 0);
  const completedToday = visibleRules.filter(r => checks[r.id]).length;
  return (
    <div className="slide-up" style={{ padding: "56px 20px 24px" }}>
      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 11, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Daily Check</div>
        <h1 className="display" style={{ fontSize: 56, color: C.text, lineHeight: 1, margin: "4px 0 0" }}>HARD RULES</h1>
      </div>
      <div style={{ padding: 20, borderRadius: 24,
        background: "linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,107,53,0.05) 60%, transparent)",
        border: `1px solid ${C.accentBorder}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 4 }}>Current Streak</div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
              <span className="display" style={{ fontSize: 64, color: C.text, lineHeight: 1 }}>{streak}</span>
              <span className="display" style={{ fontSize: 20, color: C.textMuted }}>{streak === 1 ? "DAY" : "DAYS"}</span>
            </div>
          </div>
          <Icon name="flame" size={48} color={C.accent} strokeWidth={1.5} />
        </div>
        <div style={{ marginTop: 12, fontSize: 12, color: C.textMuted }}>{completedToday} of {visibleRules.length} hit today</div>
      </div>
      <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 8 }}>
        {visibleRules.map(rule => {
          const done = checks[rule.id];
          return (
            <button key={rule.id} onClick={() => toggle(rule.id)}
              style={{ width: "100%", padding: 16, borderRadius: 16,
                background: done ? C.greenDim : "rgba(20,20,20,0.4)",
                border: `1px solid ${done ? C.greenBorder : C.border}`,
                display: "flex", alignItems: "center", gap: 12, cursor: "pointer", textAlign: "left" }}>
              <div style={{ width: 40, height: 40, borderRadius: "50%",
                background: done ? C.green : C.surfaceAlt,
                display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                {done ? <Icon name="check" size={18} color="#000" strokeWidth={3} /> : <Icon name={rule.icon} size={18} color={C.textMuted} />}
              </div>
              <span style={{ flex: 1, fontSize: 15, color: done ? C.text : C.textMuted }}>{rule.label}</span>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: done ? C.green : C.veryFaint }} />
            </button>
          );
        })}
      </div>
      <div style={{ marginTop: 32 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <Icon name="moon" size={16} color={C.textMuted} />
          <h3 className="display" style={{ fontSize: 22, color: C.text, letterSpacing: "0.1em", margin: 0 }}>SLEEP LOG</h3>
        </div>
        <div style={{ padding: 20, borderRadius: 24, background: "rgba(20,20,20,0.4)", border: `1px solid ${C.border}` }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>Lights Out</div>
              <input type="time" value={sleepData.down} onChange={e => saveSleep({ ...sleepData, down: e.target.value })}
                className="mono" style={{ width: "100%", padding: "8px 12px", borderRadius: 12, background: "rgba(26,26,26,0.5)", border: `1px solid ${C.border}`, color: C.text, outline: "none" }} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>Woke Up</div>
              <input type="time" value={sleepData.up} onChange={e => saveSleep({ ...sleepData, up: e.target.value })}
                className="mono" style={{ width: "100%", padding: "8px 12px", borderRadius: 12, background: "rgba(26,26,26,0.5)", border: `1px solid ${C.border}`, color: C.text, outline: "none" }} />
            </div>
          </div>
          {sleep && (
            <div style={{ paddingTop: 12, borderTop: `1px solid ${C.border}`,
              display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 12, color: C.textFaint }}>Total</span>
              <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
                <span className="display" style={{ fontSize: 24, color: C.text, lineHeight: 1 }}>
                  {sleep.h}<span style={{ color: C.textFaint, fontSize: 14 }}>h</span> {sleep.m}<span style={{ color: C.textFaint, fontSize: 14 }}>m</span>
                </span>
                {sleep.total < 7*60 ? (
                  <span style={{ marginLeft: 8, fontSize: 10, color: C.red, textTransform: "uppercase", letterSpacing: "0.18em" }}>Below floor</span>
                ) : (
                  <span style={{ marginLeft: 8, fontSize: 10, color: C.green, textTransform: "uppercase", letterSpacing: "0.18em" }}>7h+ ✓</span>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
      <div style={{ marginTop: 32, marginBottom: 16, padding: 20, borderRadius: 24, border: `1px solid ${C.border}`, background: "rgba(20,20,20,0.2)" }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>The Why</div>
        <p className="serif" style={{ fontSize: 14, color: C.textMuted, lineHeight: 1.6, fontStyle: "italic", margin: 0 }}>
          "He who is faithful in a very little is also faithful in much."
        </p>
        <div className="mono" style={{ fontSize: 11, color: C.textFaint, marginTop: 6 }}>— Luke 16:10</div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
document.getElementById("boot").classList.add("gone");
</script>
</body>
</html>
