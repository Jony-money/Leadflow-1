function Icon({ name, size = 24, strokeWidth = 2, fill = "none", color = "currentColor", style, ...rest }) {
  const props = {
    width: size, height: size, viewBox: "0 0 24 24",
    fill, stroke: color, strokeWidth,
    strokeLinecap: "round", strokeLinejoin: "round",
    style, "aria-hidden": true,
  };
  switch (name) {
    case "clock":      return <svg {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    case "calendar":   return <svg {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    case "dumbbell":   return <svg {...props}><path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/></svg>;
    case "checksquare":return <svg {...props}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
    case "chevronright": return <svg {...props}><polyline points="9 18 15 12 9 6"/></svg>;
    case "chevronleft":  return <svg {...props}><polyline points="15 18 9 12 15 6"/></svg>;
    case "plus":   return <svg {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "minus":  return <svg {...props}><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "check":  return <svg {...props}><polyline points="20 6 9 17 4 12"/></svg>;
    case "x":      return <svg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "flame":  return <svg {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
    case "moon":   return <svg {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    case "sun":    return <svg {...props}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    case "coffee": return <svg {...props}><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>;
    case "trendingup": return <svg {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    case "target": return <svg {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    case "play":   return <svg {...props} fill={color}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    case "pause":  return <svg {...props} fill={color}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
    case "rotateccw": return <svg {...props}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
    case "trophy": return <svg {...props}><line x1="6" y1="9" x2="18" y2="9"/><line x1="6" y1="9" x2="6" y2="14"/><line x1="18" y1="9" x2="18" y2="14"/><path d="M6 14a6 6 0 0 0 12 0"/><line x1="12" y1="15" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>;
    case "circle": return <svg {...props}><circle cx="12" cy="12" r="10"/></svg>;
    default: return null;
  }
}

const minutesFromTimeStr = (t) => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const formatTime = (t) => {
  const [h,m] = t.split(":").map(Number);
  const realH = h % 24;
  const ampm = realH >= 12 ? "PM" : "AM";
  const displayH = realH === 0 ? 12 : realH > 12 ? realH-12 : realH;
  return `${displayH}:${String(m).padStart(2,"0")} ${ampm}`;
};
const getCurrentDay = () => DAYS[new Date().getDay()];
const getCurrentBlock = (day) => {
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  const dayData = SCHEDULE[day];
  if (!dayData) return null;
  for (let i = 0; i < dayData.blocks.length; i++) {
    const b = dayData.blocks[i];
    const start = minutesFromTimeStr(b.start);
    const endRaw = minutesFromTimeStr(b.end);
    if (endRaw > 24*60) {
      if (nowMins >= start || nowMins < (endRaw - 24*60)) {
        const total = endRaw - start;
        const elapsed = nowMins >= start ? nowMins - start : (24*60 - start) + nowMins;
        return { ...b, index: i, progress: elapsed/total };
      }
    } else if (nowMins >= start && nowMins < endRaw) {
      return { ...b, index: i, progress: (nowMins - start) / (endRaw - start) };
    }
  }
  return null;
};
const getNextBlock = (day, currentIndex) => {
  const dayData = SCHEDULE[day];
  if (!dayData) return null;
  if (currentIndex !== null && currentIndex !== undefined) {
    if (currentIndex + 1 < dayData.blocks.length) return dayData.blocks[currentIndex+1];
    return null;
  }
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  for (const b of dayData.blocks) {
    if (minutesFromTimeStr(b.start) > nowMins) return b;
  }
  return null;
};
const minutesUntilEnd = (block) => {
  if (!block) return 0;
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  const endRaw = minutesFromTimeStr(block.end);
  if (endRaw > 24*60) {
    const realEnd = endRaw - 24*60;
    if (nowMins >= minutesFromTimeStr(block.start)) return (24*60 - nowMins) + realEnd;
    return realEnd - nowMins;
  }
  return endRaw - nowMins;
};

const safeGet = (key) => {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
};
const safeSet = (key, val) => {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
};
const safeDelete = (key) => {
  try { localStorage.removeItem(key); } catch {}
};

          background: C.accent, color: "#000", border: "none",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          cursor: "pointer", fontSize: 18, letterSpacing: "0.1em" }}>
        <span>{isToday ? "START TODAY'S WORKOUT" : `START ${w.title} WORKOUT`}</span>
        <Play size={20} fill="currentColor" />
      </button>

      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 8 }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 4 }}>Exercise List</div>
        {w.exercises.map((ex, i) => {
          const last = history[ex.id];
          return (
            <div key={ex.id} style={{ padding: 16, borderRadius: 16,
              background: "rgba(20,20,20,0.4)", border: `1px solid ${C.border}`,
              display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span className="display" style={{ fontSize: 20, color: C.veryFaint, width: 24 }}>{String(i+1).padStart(2,"0")}</span>
                <div>
                  <div className="display" style={{ fontSize: 18, color: C.text, lineHeight: 1 }}>{ex.name}</div>
                  <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginTop: 4 }}>
                    {ex.sets} sets × {ex.repsLow === ex.repsHigh ? ex.repsLow : `${ex.repsLow}–${ex.repsHigh}`} reps
                  </div>
                </div>
              </div>
              {last ? (
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Last</div>
                  <div className="mono" style={{ fontSize: 14, color: C.accent }}>
                    {last.topWeight}{ex.id === "plank" ? "s" : "lb"}
                  </div>
                </div>
              ) : (
                <Circle size={16} color={C.veryFaint} />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function getSuggestion(last, ex) {
  if (!last) return { weight: 0, reps: ex.repsHigh };
  if (last.topReps >= ex.repsHigh) {
    return { weight: last.topWeight + (ex.increment || 0), reps: ex.repsLow };
  }
  return { weight: last.topWeight, reps: Math.min(ex.repsHigh, last.topReps + 1) };
}

function ActiveWorkout({ day, onExit }) {
  const workout = WORKOUTS[day];
  const [exerciseIdx, setExerciseIdx] = useState(0);
  const [setLogs, setSetLogs] = useState({});
  const [currentWeight, setCurrentWeight] = useState("");
  const [currentReps, setCurrentReps] = useState("");
  const [history, setHistory] = useState({});
  const [showRestTimer, setShowRestTimer] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const ex = workout.exercises[exerciseIdx];
  const completedSets = setLogs[ex.id]?.length || 0;
  const totalSets = ex.sets;

  useEffect(() => {
    (async () => {
      const data = safeGet(`workout-prs:${day}`);
      if (data) setHistory(data);
      const draft = safeGet(`workout-draft:${day}:${todayKey()}`);
      if (draft) {
        setSetLogs(draft.setLogs || {});
        setExerciseIdx(draft.exerciseIdx || 0);
      }
      setLoaded(true);
    })();
  }, [day]);

  useEffect(() => {
    if (!loaded) return;
    const last = history[ex.id];
    const existing = setLogs[ex.id] || [];
    if (existing.length > 0) {
      const lastSet = existing[existing.length - 1];
      setCurrentWeight(String(lastSet.weight));
      setCurrentReps(String(lastSet.reps));
    } else if (last) {
      const s = getSuggestion(last, ex);
      setCurrentWeight(String(s.weight));
      setCurrentReps(String(s.reps));
    } else {
      setCurrentWeight("");
      setCurrentReps(String(ex.repsHigh));
    }
  }, [exerciseIdx, loaded]);

  const saveDraft = async (newLogs, newIdx) => {
    safeSet(`workout-draft:${day}:${todayKey()}`, {
      setLogs: newLogs, exerciseIdx: newIdx ?? exerciseIdx,
    });
  };

  const logSet = () => {
    const w = parseFloat(currentWeight) || 0;
    const r = parseInt(currentReps) || 0;
    if (r === 0) return;
    const exSets = setLogs[ex.id] || [];
    const newSets = [...exSets, { weight: w, reps: r }];
    const newLogs = { ...setLogs, [ex.id]: newSets };
    setSetLogs(newLogs);
    saveDraft(newLogs);
    setShowRestTimer(true);
  };

  const undoLast = () => {
    const exSets = setLogs[ex.id] || [];
    if (exSets.length === 0) return;
    const newLogs = { ...setLogs, [ex.id]: exSets.slice(0, -1) };
    setSetLogs(newLogs);
    saveDraft(newLogs);
  };

  const nextExercise = () => {
    if (exerciseIdx < workout.exercises.length - 1) {
      const newIdx = exerciseIdx + 1;
      setExerciseIdx(newIdx);
      saveDraft(setLogs, newIdx);
      setShowRestTimer(false);
    } else {
      finishWorkout();
    }
  };

  const prevExercise = () => {
    if (exerciseIdx > 0) {
      const newIdx = exerciseIdx - 1;
      setExerciseIdx(newIdx);
      saveDraft(setLogs, newIdx);
    }
  };

  const finishWorkout = async () => {
    safeSet(`workout-log:${day}:${todayKey()}`, { setLogs, completed: new Date().toISOString() });
    const newPrs = { ...history };
    workout.exercises.forEach(exer => {
      const sets = setLogs[exer.id];
      if (!sets || sets.length === 0) return;
      const topWeight = Math.max(...sets.map(s => s.weight));
      const topSet = sets.reduce((best, s) => (s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps) ? s : best), sets[0]);
      newPrs[exer.id] = { topWeight, topReps: topSet.reps, sets, date: todayKey() };
    });
    safeSet(`workout-prs:${day}`, newPrs);
    safeDelete(`workout-draft:${day}:${todayKey()}`);
    onExit();
  };

  const exHistory = history[ex.id];
  const allSetsDone = completedSets >= totalSets;
  const isLastEx = exerciseIdx === workout.exercises.length - 1;

  const inputBoxStyle = { padding: 20, borderRadius: 16,
    background: "rgba(20,20,20,0.6)", border: `1px solid ${C.borderStrong}` };
  const stepBtnStyle = { width: 48, height: 48, borderRadius: "50%",
    background: C.surfaceAlt, border: "none",
    display: "flex", alignItems: "center", justifyContent: "center",
    color: C.text, cursor: "pointer" };

  return (
    <div className="slide-up" style={{ padding: "56px 20px 128px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <button onClick={onExit}
          style={{ background: "none", border: "none", color: C.textFaint, fontSize: 14,
            display: "flex", alignItems: "center", gap: 4, cursor: "pointer", padding: 0 }}>
          <ChevronLeft size={18} /> Exit
        </button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Exercise</div>
          <div className="mono" style={{ fontSize: 14, color: C.textMuted }}>{exerciseIdx + 1} / {workout.exercises.length}</div>
        </div>
        <button onClick={finishWorkout} className="display"
          style={{ background: "none", border: "none", color: C.accent, fontSize: 14,
            letterSpacing: "0.1em", cursor: "pointer", padding: 0 }}>
          FINISH
        </button>
      </div>

      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>{workout.title} DAY</div>
      </div>

      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div className="display" style={{ fontSize: 48, color: C.text, lineHeight: 1 }}>{ex.name}</div>
        <div style={{ fontSize: 14, color: C.textFaint, marginTop: 8 }}>
          {totalSets} sets × {ex.repsLow === ex.repsHigh ? ex.repsLow : `${ex.repsLow}–${ex.repsHigh}`} reps
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 24 }}>
        {Array.from({ length: totalSets }).map((_, i) => {
          const set = setLogs[ex.id]?.[i];
          return (
            <div key={i} style={{ width: 48, height: 48, borderRadius: "50%",
              border: `2px solid ${set ? C.green : i === completedSets ? C.accent : C.borderStrong}`,
              background: set ? "rgba(34,197,94,0.15)" : i === completedSets ? "rgba(255,107,53,0.15)" : "transparent",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              {set ? (
                <>
                  <span className="mono" style={{ fontSize: 9, color: C.green, lineHeight: 1 }}>
                    {set.weight}{ex.id === "plank" ? "s" : ""}
                  </span>
                  <span className="mono" style={{ fontSize: 9, color: C.green, lineHeight: 1, marginTop: 1 }}>
                    {set.reps}{ex.id !== "plank" ? "r" : ""}
                  </span>
                </>
              ) : (
                <span className="display" style={{ fontSize: 16, color: C.textFaint }}>{i+1}</span>
              )}
            </div>
          );
        })}
      </div>

      {exHistory && (
        <div style={{ padding: 16, borderRadius: 16, marginBottom: 24,
          background: "rgba(20,20,20,0.5)", border: `1px solid ${C.border}`,
          display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>
              Last Session ({exHistory.date})
            </div>
            <div className="mono" style={{ fontSize: 14, color: C.textMuted, marginTop: 4 }}>
              Top: {exHistory.topWeight}{ex.id === "plank" ? "s" : "lb"} × {exHistory.topReps} reps
            </div>
          </div>
          {!setLogs[ex.id]?.length && (() => {
            const s = getSuggestion(exHistory, ex);
            return (
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em" }}>Suggestion</div>
                <div className="mono" style={{ fontSize: 14, color: C.text, marginTop: 4 }}>
                  {s.weight}{ex.id === "plank" ? "s" : "lb"} × {s.reps}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {!allSetsDone ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={inputBoxStyle}>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>
              {ex.id === "plank" ? "Seconds" : "Weight (lb)"}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button style={stepBtnStyle}
                onClick={() => setCurrentWeight(String(Math.max(0, parseFloat(currentWeight || 0) - (ex.increment || 5))))}>
                <Minus size={20} />
              </button>
              <input inputMode="decimal" value={currentWeight}
                onChange={e => setCurrentWeight(e.target.value)} placeholder="0" className="display"
                style={{ flex: 1, background: "transparent", border: "none", outline: "none",
                  textAlign: "center", fontSize: 48, color: C.text, minWidth: 0 }} />
              <button style={stepBtnStyle}
                onClick={() => setCurrentWeight(String(parseFloat(currentWeight || 0) + (ex.increment || 5)))}>
                <Plus size={20} />
              </button>
            </div>
          </div>

          <div style={inputBoxStyle}>
            <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>
              {ex.id === "plank" ? "Reps (target seconds above)" : "Reps"}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button style={stepBtnStyle}
                onClick={() => setCurrentReps(String(Math.max(0, parseInt(currentReps || 0) - 1)))}>
                <Minus size={20} />
              </button>
              <input inputMode="numeric" value={currentReps}
                onChange={e => setCurrentReps(e.target.value)} placeholder="0" className="display"
                style={{ flex: 1, background: "transparent", border: "none", outline: "none",
                  textAlign: "center", fontSize: 48, color: C.text, minWidth: 0 }} />
              <button style={stepBtnStyle}
                onClick={() => setCurrentReps(String(parseInt(currentReps || 0) + 1))}>
                <Plus size={20} />
              </button>
            </div>
          </div>

          <button onClick={logSet} className="display"
            style={{ width: "100%", padding: 20, borderRadius: 16,
              background: C.accent, color: "#000", border: "none",
              fontSize: 18, letterSpacing: "0.1em",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              cursor: "pointer" }}>
            <Check size={20} color="#000" strokeWidth={3} />
            LOG SET {completedSets + 1}
          </button>

          {completedSets > 0 && (
            <button onClick={undoLast}
              style={{ width: "100%", padding: 12, borderRadius: 16,
                background: "transparent", border: "none",
                color: C.textFaint, fontSize: 14, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <RotateCcw size={14} /> Undo last set
            </button>
          )}
        </div>
      ) : (
        <div style={{ padding: 24, borderRadius: 16, textAlign: "center",
          background: C.greenDim, border: `1px solid ${C.greenBorder}` }}>
          <Trophy size={32} color={C.green} style={{ display: "block", margin: "0 auto 8px" }} />
          <div className="display" style={{ fontSize: 24, color: C.text }}>EXERCISE COMPLETE</div>
          <div style={{ fontSize: 14, color: C.textMuted, marginTop: 4 }}>Move on or review</div>
        </div>
      )}

      {showRestTimer && !allSetsDone && <RestTimer onClose={() => setShowRestTimer(false)} />}

      <div style={{ marginTop: 24, display: "flex", gap: 8 }}>
        <button onClick={prevExercise} disabled={exerciseIdx === 0}
          style={{ flex: 1, padding: 12, borderRadius: 16,
            border: `1px solid ${C.border}`, background: "transparent",
            color: C.textMuted, opacity: exerciseIdx === 0 ? 0.3 : 1,
            display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
            cursor: exerciseIdx === 0 ? "default" : "pointer", fontSize: 14 }}>
          <ChevronLeft size={16} /> Previous
        </button>
        <button onClick={nextExercise}
          style={{ flex: 1, padding: 12, borderRadius: 16,
            border: `1px solid ${C.border}`, background: "transparent",
            color: C.text,
            display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
            cursor: "pointer", fontSize: 14 }}>
          {isLastEx ? "Finish" : "Next"} <ChevronRight size={16} />
        </button>
      </div>
    </div>
  );
}

function RestTimer({ onClose }) {
  const [seconds, setSeconds] = useState(120);
  const [running, setRunning] = useState(true);

  useEffect(() => {
    if (!running) return;
    const i = setInterval(() => setSeconds(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(i);
  }, [running]);

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return (
    <div className="slide-up" style={{ position: "fixed", bottom: 100, left: 16, right: 16,
      maxWidth: 448, margin: "0 auto",
      padding: 16, borderRadius: 16,
      background: C.surface, border: `1px solid ${C.accentBorder}`,
      display: "flex", alignItems: "center", gap: 12, zIndex: 40 }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em" }}>Rest</div>
        <div className="display" style={{ fontSize: 28, color: C.text, lineHeight: 1, marginTop: 2 }}>
          {mins}:{String(secs).padStart(2, "0")}
        </div>
      </div>
      <button onClick={() => setSeconds(s => s + 30)}
        style={{ padding: "8px 12px", borderRadius: 12,
          background: C.surfaceAlt, border: "none", color: C.textMuted, fontSize: 12,
          cursor: "pointer" }}>+30s</button>
      <button onClick={() => setRunning(!running)}
        style={{ width: 40, height: 40, borderRadius: "50%",
          background: C.accent, border: "none", color: "#000",
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer" }}>
        {running ? <Pause size={16} fill="currentColor" /> : <Play size={16} fill="currentColor" />}
      </button>
      <button onClick={onClose}
        style={{ width: 40, height: 40, borderRadius: "50%",
          background: C.surfaceAlt, border: "none", color: C.textFaint,
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer" }}>
        <X size={16} />
      </button>
    </div>
  );
}

function HabitsTab() {
  const [checks, setChecks] = useState({});
  const [streak, setStreak] = useState(0);
  const [sleepData, setSleepData] = useState({ down: "", up: "" });

  useEffect(() => {
    (async () => {
      const todayChecks = safeGet(`habits:${todayKey()}`);
      if (todayChecks) setChecks(todayChecks);
      const sleep = safeGet(`sleep:${todayKey()}`);
      if (sleep) setSleepData(sleep);

      let s = 0;
      for (let i = 0; i < 60; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        const c = safeGet(`habits:${k}`);
        const dayIdx = d.getDay();
        const required = HARD_RULES.filter(r => !r.sundayOnly || dayIdx === 0);
        if (!c) break;
        const allDone = required.every(r => c[r.id]);
        if (!allDone) break;
        s++;
      }
      setStreak(s);
    })();
  }, []);

  const toggle = async (id) => {
    const newChecks = { ...checks, [id]: !checks[id] };
    setChecks(newChecks);
    safeSet(`habits:${todayKey()}`, newChecks);
  };
  const saveSleep = async (val) => { setSleepData(val); safeSet(`sleep:${todayKey()}`, val); };

  const calcSleepHours = () => {
    if (!sleepData.down || !sleepData.up) return null;
    const [dh, dm] = sleepData.down.split(":").map(Number);
    const [uh, um] = sleepData.up.split(":").map(Number);
    let mins = (uh*60 + um) - (dh*60 + dm);
    if (mins < 0) mins += 24*60;
    return { h: Math.floor(mins/60), m: mins%60, total: mins };
  };

  const sleep = calcSleepHours();
  const dayIdx = new Date().getDay();
  const visibleRules = HARD_RULES.filter(r => !r.sundayOnly || dayIdx === 0);
  const completedToday = visibleRules.filter(r => checks[r.id]).length;

  return (
    <div className="slide-up" style={{ padding: "56px 20px 24px" }}>
      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 11, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em" }}>Daily Check</div>
        <h1 className="display" style={{ fontSize: 56, color: C.text, lineHeight: 1, margin: "4px 0 0" }}>HARD RULES</h1>
      </div>

      <div style={{ padding: 20, borderRadius: 24,
        background: "linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,107,53,0.05) 60%, transparent)",
        border: `1px solid ${C.accentBorder}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 10, color: C.accent, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 4 }}>Current Streak</div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
              <span className="display" style={{ fontSize: 64, color: C.text, lineHeight: 1 }}>{streak}</span>
              <span className="display" style={{ fontSize: 20, color: C.textMuted }}>{streak === 1 ? "DAY" : "DAYS"}</span>
            </div>
          </div>
          <Flame size={48} color={C.accent} strokeWidth={1.5} />
        </div>
        <div style={{ marginTop: 12, fontSize: 12, color: C.textMuted }}>
          {completedToday} of {visibleRules.length} hit today
        </div>
      </div>

      <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 8 }}>
        {visibleRules.map(rule => {
          const Icon = rule.icon;
          const done = checks[rule.id];
          return (
            <button key={rule.id} onClick={() => toggle(rule.id)}
              style={{ width: "100%", padding: 16, borderRadius: 16,
                background: done ? C.greenDim : "rgba(20,20,20,0.4)",
                border: `1px solid ${done ? C.greenBorder : C.border}`,
                display: "flex", alignItems: "center", gap: 12,
                cursor: "pointer", textAlign: "left" }}>
              <div style={{ width: 40, height: 40, borderRadius: "50%",
                background: done ? C.green : C.surfaceAlt,
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0 }}>
                {done ? <Check size={18} color="#000" strokeWidth={3} /> : <Icon size={18} color={C.textMuted} />}
              </div>
              <span style={{ flex: 1, fontSize: 15, color: done ? C.text : C.textMuted }}>{rule.label}</span>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: done ? C.green : C.veryFaint }} />
            </button>
          );
        })}
      </div>

      <div style={{ marginTop: 32 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <Moon size={16} color={C.textMuted} />
          <h3 className="display" style={{ fontSize: 22, color: C.text, letterSpacing: "0.1em", margin: 0 }}>SLEEP LOG</h3>
        </div>
        <div style={{ padding: 20, borderRadius: 24, background: "rgba(20,20,20,0.4)", border: `1px solid ${C.border}` }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>Lights Out</div>
              <input type="time" value={sleepData.down}
                onChange={e => saveSleep({ ...sleepData, down: e.target.value })}
                className="mono"
                style={{ width: "100%", padding: "8px 12px", borderRadius: 12,
                  background: "rgba(26,26,26,0.5)", border: `1px solid ${C.border}`,
                  color: C.text, outline: "none" }} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>Woke Up</div>
              <input type="time" value={sleepData.up}
                onChange={e => saveSleep({ ...sleepData, up: e.target.value })}
                className="mono"
                style={{ width: "100%", padding: "8px 12px", borderRadius: 12,
                  background: "rgba(26,26,26,0.5)", border: `1px solid ${C.border}`,
                  color: C.text, outline: "none" }} />
            </div>
          </div>
          {sleep && (
            <div style={{ paddingTop: 12, borderTop: `1px solid ${C.border}`,
              display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 12, color: C.textFaint }}>Total</span>
              <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
                <span className="display" style={{ fontSize: 24, color: C.text, lineHeight: 1 }}>
                  {sleep.h}<span style={{ color: C.textFaint, fontSize: 14 }}>h</span> {sleep.m}<span style={{ color: C.textFaint, fontSize: 14 }}>m</span>
                </span>
                {sleep.total < 7*60 ? (
                  <span style={{ marginLeft: 8, fontSize: 10, color: C.red, textTransform: "uppercase", letterSpacing: "0.18em" }}>Below floor</span>
                ) : (
                  <span style={{ marginLeft: 8, fontSize: 10, color: C.green, textTransform: "uppercase", letterSpacing: "0.18em" }}>7h+ ✓</span>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={{ marginTop: 32, marginBottom: 16, padding: 20, borderRadius: 24, border: `1px solid ${C.border}`, background: "rgba(20,20,20,0.2)" }}>
        <div style={{ fontSize: 10, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 8 }}>The Why</div>
        <p style={{ fontSize: 14, color: C.textMuted, lineHeight: 1.6, fontStyle: "italic", margin: 0 }}>
          "The 7-hour sleep floor and the Sunday off — that's the engine maintenance.
          Skip the maintenance and the gas pedal stops mattering because the engine breaks."
        </p>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
document.getElementById("boot").classList.add("gone");

</script>
</body>
</html>
